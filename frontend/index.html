<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCRR Invoice — KSeF</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="toast" class="toast hidden"></div>
<div class="layout">
  <aside class="sidebar">
    <h1>Faktury KSeF</h1>
    <ul id="invoice-list"></ul>
  </aside>
  <main class="workspace">
    <div id="empty-state">Wybierz fakturę z listy.</div>
    <div id="review" class="review hidden">
      <div class="pdf-pane">
        <iframe id="pdf-frame" title="Podgląd PDF"></iframe>
      </div>
      <form id="review-form" class="form-pane" autocomplete="off">
        <label>Kontrahent
          <input name="firm_name" required>
        </label>
        <label>Numer FV
          <input name="invoice_number" required>
        </label>
        <label>Data FV
          <input name="invoice_date" required>
        </label>
        <label>Termin płatności
          <input name="payment_date">
        </label>
        <label>
          Status płatności
          <span id="ambiguous-badge" class="badge hidden">niepewne — sprawdź PDF</span>
          <input name="payment_status" required>
        </label>
        <label>Forma płatności
          <input name="payment_form">
        </label>
        <label>Kwota brutto
          <input name="brutto" type="number" step="0.01" required>
        </label>
        <label>Kategoria
          <input name="kategoria">
        </label>
        <input type="hidden" name="scanned_firm">

        <div class="actions">
          <button type="button" id="btn-skip" class="btn">Pomiń</button>
          <button type="button" id="btn-queue" class="btn">Kolejkuj do zapłaty</button>
          <button type="submit" id="btn-confirm" class="btn btn-primary">Akceptuj</button>
        </div>
        <p id="status-msg"></p>
      </form>
    </div>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
