services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # core/paths.py czyta tę zmienną jako nadrzędną wobec logiki
      # platform.system() — w kontenerze zawsze chcemy /data.
      - INVOICES_BASE_PATH=/data
      # Nadpisuje DB_DRIVER z .env (tam zostaje Driver 17 dla CLI na hoście) —
      # w obrazie jest doinstalowany Driver 18, patrz Dockerfile.
      - DB_DRIVER=ODBC Driver 18 for SQL Server
    volumes:
      # Faktury zostają fizycznie na dysku hosta — kontener widzi cały
      # HOST_DATA_DIR pod /data (patrz INVOICES_BASE_PATH powyżej). Domyślnie
      # "." (katalog projektu) — dokładnie jak dotąd (faktury_surowe/,
      # faktury_przetworzone/ jako podfoldery). Na nowym komputerze, z inną
      # lokalizacją faktur, wystarczy ustawić HOST_DATA_DIR w .env — który
      # dokładnie podfolder pełni jaką rolę (KSeF/inne/EURO/cel) wybiera się
      # już z poziomu przeglądarki (⚙️ w sidebarze), bez zmian tutaj.
      - ${HOST_DATA_DIR:-.}:/data
      # Alternatywa dla powyższego bind-mounta: montowanie udziału Qnap (SMB/CIFS)
      # bezpośrednio jako wolumin Dockera — potrzebne, gdy dysk sieciowy zmapowany
      # na literę (np. I:) nie jest widoczny wewnątrz WSL2 (Docker Desktop na
      # Windows nie widzi wtedy zawartości mimo że Eksplorator widzi normalnie).
      # Żeby użyć: zakomentuj linię ${HOST_DATA_DIR:-.}:/data powyżej, odkomentuj
      # "- qnap_data:/data" poniżej oraz sekcję "volumes:" na końcu pliku, i ustaw
      # w .env: QNAP_USER, QNAP_PASSWORD, QNAP_DEVICE (np. //192.168.30.11/Faktury).
      # - qnap_data:/data
      # json/ (settings.json, patterns.json, knowledge_base.json,
      # dzial_kategoria.json) jest czytany ścieżkami względnymi wobec CWD
      # (= WORKDIR /app), więc montujemy go osobno pod /app, nie pod /data.
      # Montujemy CAŁY katalog (nie pojedyncze pliki) celowo: settings.json/
      # patterns.json są w .gitignore i na świeżym checkoucie repo (nowy
      # komputer) nie istnieją jeszcze na dysku — bind mount pojedynczego
      # nieistniejącego pliku każe Dockerowi cicho utworzyć zamiast niego
      # pusty katalog na hoście, co potem wywala aplikację (open() na
      # katalogu = IsADirectoryError). json/ zawsze istnieje (jest w repo),
      # więc ten problem nie występuje — brakujące settings.json/patterns.json
      # config_manager.py tworzy sam, od środka.
      - ./json:/app/json
    restart: unless-stopped
    # Jeśli DB_SERVER / SMTP_SERVER w .env wskazują na "localhost" — z
    # wnętrza kontenera trzeba je zmienić na host.docker.internal (na
    # Docker Desktop dla macOS działa to bez dodatkowej konfiguracji).

# Odkomentuj razem z "- qnap_data:/data" powyżej, żeby montować udział Qnap
# przez CIFS zamiast bind-mounta z hosta (patrz komentarz przy volumes: api).
# volumes:
#   qnap_data:
#     driver: local
#     driver_opts:
#       type: cifs
#       o: "username=${QNAP_USER},password=${QNAP_PASSWORD},vers=3.0"
#       device: "${QNAP_DEVICE}"
