version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Kontener szuka faktur w katalogu /data
      - INVOICES_BASE_PATH=/data
      # Sterownik bazy danych ODBC wewnątrz kontenera
      - DB_DRIVER=ODBC Driver 18 for SQL Server
    volumes:
      # Zamontowany dysk QNAP w trybie tylko do odczytu
      - /mnt/qnap:/data:/data
      # Pliki konfiguracyjne z prawami zapisu
      - ./json:/app/json
    restart: unless-stopped
